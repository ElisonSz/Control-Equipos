services:
  mongodb:
    image: mongo:7.0
    container_name: control-equipos-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: control-equipos
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - control-equipos-dev-network

  redis:
    image: redis:7-alpine
    container_name: control-equipos-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - control-equipos-dev-network

volumes:
  mongodb_dev_data:
  redis_dev_data:

networks:
  control-equipos-dev-network:
    driver: bridge


